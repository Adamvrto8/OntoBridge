[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontobridge"
version = "0.1.0"
description = "Multi-agent semantic term governance system for retail banking"
requires-python = ">=3.10"
dependencies = [
    "rdflib>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
dashboard = [
    "streamlit>=1.28",
    "pyvis>=0.3",
]
embeddings = [
    "sentence-transformers>=2.2",
]
readers = [
    "pypdf>=3.0",
    "python-docx>=1.0",
]
nlp = [
    "spacy>=3.7",
]
vector = [
    "chromadb>=0.4",
]
llm = [
    "langchain-ollama>=0.2",
    "langchain-core>=0.3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ontobridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
