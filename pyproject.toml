[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontobridge"
version = "0.1.0"
description = "Multi-agent semantic term governance system for retail banking"
requires-python = ">=3.10"
dependencies = [
    "rdflib>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
dashboard = [
    "streamlit>=1.28",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ontobridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
